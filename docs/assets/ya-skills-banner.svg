<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" fill="none" role="img" aria-label="ya-skills — a skill catalog and the yk CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141233"/>
      <stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="876" height="236" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <rect x="56" y="54" width="8" height="132" rx="4" fill="url(#accent)"/>

  <text x="86" y="120" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">ya<tspan fill="url(#accent)">-</tspan>skills</text>

  <text x="88" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#cbd5e1">A skill catalog + the <tspan fill="#67e8f9" font-weight="600">yk</tspan> CLI for agent-powered repos.</text>

  <rect x="88" y="178" width="486" height="32" rx="8" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.10"/>
  <text x="104" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#a5b4fc">$ brew install ya-skills  ·  yk install video-transcript</text>
</svg>
