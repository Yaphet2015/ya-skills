name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Open or publish release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

  upload-macos-arm64-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    outputs:
      asset_name: ${{ steps.upload.outputs.asset_name }}
      asset_sha256: ${{ steps.upload.outputs.asset_sha256 }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Set up Bun
        run: |
          bun_zip="${RUNNER_TEMP}/bun.zip"
          bun_dir="${RUNNER_TEMP}/bun"
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 10 \
            --output "${bun_zip}" \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-darwin-aarch64.zip"
          unzip -q "${bun_zip}" -d "${bun_dir}"
          echo "${bun_dir}/bun-darwin-aarch64" >> "${GITHUB_PATH}"
          "${bun_dir}/bun-darwin-aarch64/bun" --revision

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Typecheck
        run: bun run typecheck

      - name: Test (default suite, desktop-free)
        run: bun test

      - name: Package release asset
        id: package
        run: |
          version="${{ needs.release-please.outputs.version }}"
          bun run package:release -- --version "${version}"
          asset="ya-skills-v${version}-macos-arm64.tar.gz"
          asset_sha256="$(awk '{print $1}' "${asset}.sha256")"
          echo "asset_name=${asset}" >> "${GITHUB_OUTPUT}"
          echo "asset_sha256=${asset_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Release closed loop (packaged yk, no desktop)
        run: YK_RELEASE_TESTS=1 bun test tests/computer-e2e-release.test.ts tests/computer-session-release.test.ts tests/computer-lane-release-packaging.test.ts

      - name: Build node target
        run: bun run build

      - name: Smoke
        run: bun run smoke

      - name: Upload release asset
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release-please.outputs.version }}"
          tag="${{ needs.release-please.outputs.tag_name }}"
          asset="ya-skills-v${version}-macos-arm64.tar.gz"
          # First uploader wins: never overwrite an already published asset.
          if gh release view "${tag}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "${asset}"; then
            echo "${asset} already published; keeping it and adopting its checksum."
            dir="$(mktemp -d)"
            gh release download "${tag}" --pattern "${asset}.sha256" --dir "${dir}"
            asset_sha256="$(awk '{print $1}' "${dir}/${asset}.sha256")"
          else
            gh release upload "${tag}" "${asset}" "${asset}.sha256"
            asset_sha256="${{ steps.package.outputs.asset_sha256 }}"
          fi
          echo "asset_name=${asset}" >> "${GITHUB_OUTPUT}"
          echo "asset_sha256=${asset_sha256}" >> "${GITHUB_OUTPUT}"

  update-homebrew-tap:
    needs:
      - release-please
      - upload-macos-arm64-asset
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      ASSET_NAME: ${{ needs.upload-macos-arm64-asset.outputs.asset_name }}
      ASSET_SHA256: ${{ needs.upload-macos-arm64-asset.outputs.asset_sha256 }}
    steps:
      - name: Validate tap token
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "Missing HOMEBREW_TAP_TOKEN secret with write access to Yaphet2015/homebrew-tap." >&2
            exit 1
          fi

      - name: Check out ya-skills
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          path: ya-skills

      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Yaphet2015/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update ya-skills formula
        working-directory: homebrew-tap
        run: |
          python3 ../ya-skills/scripts/update-ya-skills-formula.py Formula/ya-skills.rb
          git diff -- Formula/ya-skills.rb

      - name: Commit and push tap update
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/ya-skills.rb; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ya-skills.rb
          git commit -m "ya-skills ${VERSION}"
          git push origin HEAD:main
