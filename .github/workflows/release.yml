name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build macOS arm64 binary
        run: bun run build:binary:macos-arm64

      - name: Package release asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ya-skills-v${version}-macos-arm64.tar.gz"
          mkdir -p dist/release/ya-skills
          cp dist/yk dist/release/ya-skills/yk
          cp -R skills dist/release/ya-skills/skills
          tar -czf "${asset}" -C dist/release/ya-skills yk skills
          shasum -a 256 "${asset}" | tee "${asset}.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="ya-skills-v${version}-macos-arm64.tar.gz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${asset}" "${asset}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${asset}" "${asset}.sha256" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi
